<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YA Coffee &amp; Cake — Link</title>
<meta name="description" content="Lokasi, menu, dan media sosial YA Coffee & Cake.">
<meta name="theme-color" content="#302016">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6efe6; --card:#fffaf4; --ink:#302016; --muted:#8a6f5e;
    --accent:#cd8e50; --line:#ead9c6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; font-family:Inter,system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 15% 0%, #ecd7bf 0, transparent 45%),
      radial-gradient(circle at 100% 100%, #e7cdb2 0, transparent 40%),
      var(--bg);
    display:flex; justify-content:center; padding:48px 20px 32px;
  }
  main{width:100%; max-width:440px; text-align:center}
  .logo{
    width:150px; height:150px; margin:0 auto 18px; border-radius:50%;
    background:#fff; display:grid; place-items:center; padding:14px;
    box-shadow:0 10px 30px rgba(48,32,22,.18); border:4px solid var(--card);
    overflow:hidden;
  }
  .logo img{width:100%; height:100%; object-fit:contain}
  h1{font-family:Fraunces,serif; font-size:30px; font-weight:700; line-height:1.15}
  .tag{color:var(--muted); margin-top:6px; font-size:15px}
  .addr{
    display:inline-flex; align-items:center; gap:6px; margin-top:12px;
    font-size:13px; color:var(--muted); background:var(--card);
    border:1px solid var(--line); padding:6px 12px; border-radius:999px;
  }
  .links{display:flex; flex-direction:column; gap:12px; margin-top:28px}
  a.btn{
    display:flex; align-items:center; gap:14px; text-decoration:none;
    background:var(--card); color:var(--ink); border:1px solid var(--line);
    padding:14px 18px; border-radius:16px; font-weight:600; font-size:16px;
    box-shadow:0 2px 0 var(--line); transition:transform .15s, box-shadow .15s, background .15s;
  }
  a.btn:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(59,36,24,.12)}
  a.btn:active{transform:translateY(0)}
  a.btn.primary{background:var(--ink); color:#fff8ef; border-color:var(--ink); box-shadow:0 4px 14px rgba(59,36,24,.3)}
  .ic{
    width:38px; height:38px; flex:none; border-radius:11px; display:grid; place-items:center;
    background:#f3e2cf; color:#a8662c;
  }
  .primary .ic{background:var(--accent); color:#fff}
  .ic svg{width:20px; height:20px}
  .label{flex:1; text-align:left}
  .label small{display:block; font-weight:400; font-size:12.5px; color:var(--muted); margin-top:2px}
  .primary .label small{color:#e3cdb8}
  .arrow{opacity:.45; font-size:18px}
  footer{margin-top:32px; font-size:12px; color:var(--muted)}
</style>
</head>
